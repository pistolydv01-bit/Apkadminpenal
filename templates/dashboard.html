<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Admin Panel</title></head><body><header><b>Admin Panel</b><a href="/logout">Logout</a></header><main>
<div class="grid">{% for k,v in stats.items() %}<div class="stat"><small>{{k}}</small><strong>{{v}}</strong></div>{% endfor %}</div>
<section class="card"><h2>App Settings</h2><form method="post" action="/admin/settings"><input name="demo_tokens" value="{{settings.demo_tokens}}" placeholder="Demo tokens"><input name="group_link" value="{{settings.group_link}}" placeholder="Group link"><textarea name="announcement" placeholder="Announcement">{{settings.announcement}}</textarea><label><input type="checkbox" name="maintenance" value="1" {% if settings.maintenance=="1" %}checked{% endif %}> Maintenance</label><button>Save Settings</button></form></section>
<section class="card"><h2>Plans</h2>{% for p in plans %}<form class="row" method="post" action="/admin/plan/{{p.id}}"><input name="name" value="{{p.name}}"><input name="days" type="number" value="{{p.days}}"><input name="price" type="number" step="0.01" value="{{p.price}}"><button>Save</button></form>{% endfor %}</section>
<section class="card"><h2>Add / Update User</h2><form method="post" action="/admin/user"><input name="external_id" placeholder="App user ID" required><input name="name" placeholder="Name"><input name="tokens" type="number" value="0" placeholder="Tokens"><button>Save User</button></form></section>
<section class="card"><h2>Users</h2>{% for u in users %}<div class="user"><span><b>{{u.name or 'Unnamed'}}</b><br><small>{{u.external_id}} · Tokens {{u.tokens}}</small></span><form method="post" action="/admin/user/{{u.id}}/toggle"><button>{{'Unblock' if u.blocked else 'Block'}}</button></form></div>{% else %}<p>No users yet.</p>{% endfor %}</section>
</main></body></html>
